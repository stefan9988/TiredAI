  - role: user
    content: What does the speed rating on these mean?
  - role: assistant
    content: |-
      A speed rating indicates the maximum speed a tire is designed to safely handle. It's shown as a letter code on the sidewall — for example, the **V** rating on all the tires above corresponds to a top speed of **240 km/h (149 mph)**.

      Here are some common speed ratings:

      | Rating | Max Speed |
      |--------|-----------|
      | T | 118 mph (190 km/h) |
      | H | 130 mph (210 km/h) |
      | V | 149 mph (240 km/h) |
      | W | 168 mph (270 km/h) |
      | Y | 186 mph (300 km/h) |

      The rating is determined by standardized tests and reflects the tire's ability to sustain speed safely under controlled conditions. It doesn't mean you should drive at that speed — it's the tire's upper limit. Higher-rated tires also tend to offer better steering response and cornering grip, which is why they're common on performance-oriented vehicles.

      Would you like to know anything else about these tires?
  - role: user
    content: What tire pressure should I use for them?
  - role: assistant
    content: |-
      Recommended tire pressure isn't determined by the tire itself — it's set by your vehicle's manufacturer based on the vehicle's weight, handling, and suspension. You'll find the correct pressure on a sticker on the driver's side door jamb or in your owner's manual.

      Some general guidance:

      - **Passenger cars** typically run around **30–35 PSI** (cold), but this varies widely by vehicle.
      - **Always check pressure when tires are cold** (driven less than a mile or after sitting for 3+ hours).
      - **Don't use the number on the tire sidewall** — that's the tire's maximum pressure, not the recommended one.
      - **Never go below the manufacturer's recommendation**, as underinflation can cause overheating, uneven wear, and reduced fuel economy.

      If you share your vehicle make and model, I can point you in the right direction, but the door jamb sticker is the most reliable source. Is there anything else I can help with?
  - role: user
    content: Do I need an alignment after installing them?
  - role: assistant
    content: |-
      An alignment isn't required after every tire install, but it's recommended in certain situations:

      **You should get an alignment if:**
      - You notice uneven or rapid tire wear on your current tires
      - Your car pulls to one side while driving straight
      - Your steering wheel is off-center when driving straight
      - You've recently hit a pothole, curb, or road hazard
      - You're replacing tires due to wear (rather than just aging)

      **You may not need one if:**
      - Your old tires wore evenly
      - Your car tracks straight
      - Your steering wheel sits centered
      - You're just replacing aged tires that still had good tread

      An alignment ensures all four tires are angled correctly relative to each other and the road. Skipping it when needed can cause new tires to wear out prematurely — sometimes in just a few thousand miles.

      A good rule of thumb: get an alignment every 2–3 years or whenever you notice any of the warning signs above. It's a relatively inexpensive service (typically $50–$100) that can significantly extend tire life.

      Would you like help with anything else?
  - role: user
    content: How long does shipping usually take?
  - role: assistant
    content: |-
      I don't have access to shipping information — that would depend on the store's shipping policies, your location, and the specific order. I'd recommend checking the store's shipping FAQ or contacting their customer service for accurate delivery estimates.

      Is there anything else about the tires themselves I can help you with?
  - role: user
    content: And what does XL mean in a tire size?
  - role: assistant
    content: |-
      **XL** stands for **Extra Load**. It means the tire is built to carry a heavier maximum load than a standard tire of the same size.

      Key points:

      - **Higher inflation pressure**: XL tires require higher air pressure to support the extra weight, so always follow the recommended pressure for XL tires specifically — which may be higher than what you'd use on a standard tire.
      - **Stronger construction**: They have reinforced sidewalls and belts to handle the additional load.
      - **Where you'll see it**: Common on trucks, SUVs, and vans that carry heavier cargo or tow trailers. It's sometimes also marked as **"Extra Load"** on the sidewall.
      - **Not the same as "LT"**: LT (Light Truck) is a separate tire classification, while XL is a load-range designation within a passenger or light truck size.

      If your vehicle requires XL tires, using standard-load tires can lead to overloading, blowouts, and premature wear. Always check your vehicle's requirements.

      Anything else I can help with?
