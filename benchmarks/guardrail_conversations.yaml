- id: utqg
  llm_model: inclusionai/ling-3.0-flash-vl
  captured_at: 2026-10-05 11:56 UTC
  transcript:
  - role: user
    content: What does UTQG mean?
  - role: assistant
    content: |-
      **UTQG** stands for **Uniform Tire Quality Grading** — a rating system created by the U.S. Department of Transportation (NHTSA) that standardizes how tire performance is measured and communicated. Every tire sold in the U.S. must display a UTQG rating, which covers three categories:

      - **Treadwear** — relative durability/longevity (e.g., 400 should last twice as long as 200)
      - **Traction** — wet braking grip, graded AA (best), A, B, or C
      - **Temperature** — heat resistance at speed, graded A, B, or C

      It helps shoppers compare tires objectively across brands.
