<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TiredAI</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <aside class="sidebar">
      <button id="new-chat" type="button" class="new-chat">+ New chat</button>
      <nav id="chats" class="chats" aria-label="Chats"></nav>
    </aside>

    <div class="chat-pane">
      <header class="top">
        <div class="brand">
          <strong>TiredAI</strong>
          <span>Tire shopping assistant</span>
        </div>
        <div id="meta" class="meta">Connecting…</div>
      </header>

      <main id="messages" aria-live="polite">
        <section id="empty" class="empty">
          <h1>How can I help you find tires?</h1>
          <p>Ask for a size, a specific tire, or anything about tires.</p>
          <div class="examples">
            <button type="button" class="example">I need all-season tires in 205/60R15</button>
            <button type="button" class="example">Goodyear Eagle F1 Asymmetric SUV-4X 255/50R19 103W</button>
            <button type="button" class="example">What does UTQG mean?</button>
          </div>
        </section>
      </main>

      <footer class="bottom">
        <form id="composer" class="composer">
          <textarea id="input" rows="1" maxlength="4000" placeholder="Ask about tires…" aria-label="Message"></textarea>
          <button id="send" type="submit">Send</button>
        </form>
        <p class="hint">Enter to send, Shift+Enter for a new line.</p>
      </footer>
    </div>

    <aside id="details" class="details" aria-labelledby="details-title" hidden>
      <header class="details-top">
        <h2 id="details-title">Searches behind this answer</h2>
        <button id="details-close" type="button" class="close" aria-label="Close">×</button>
      </header>
      <div id="details-body" class="details-body"></div>
    </aside>
  </body>
</html>
